<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Station - Clean Car Galsen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="app.css">
</head>
<body class="min-h-screen relative overflow-x-hidden">
    
    <header class="sticky top-0 z-50 w-full border-b border-white/10 glass-panel">
        <div class="container mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <a href="index.html" class="text-neutral-400 hover:text-white mr-4 text-xl">←</a>
                <span class="text-blue-400 text-2xl">💧</span>
                <span class="font-bold text-xl tracking-tight">Clean Car <span class="text-transparent bg-clip-text bg-gradient-to-r from-green-500 via-yellow-400 to-red-500">Galsen</span></span>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 max-w-4xl relative z-10 animate-fade-in opacity-0">
        
        <!-- En-tête Station -->
        <div class="glass-panel rounded-3xl p-8 mb-8 border-blue-500/20 bg-blue-500/5 relative overflow-hidden">
            <div class="absolute -right-20 -top-20 w-64 h-64 bg-blue-500/20 blur-3xl rounded-full"></div>
            
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 relative z-10">
                <div>
                    <span class="bg-blue-600 text-white text-xs font-bold px-3 py-1 rounded-full mb-4 inline-block">Ouvert</span>
                    <h1 class="text-4xl font-bold mb-2">Auto Clean VIP</h1>
                    <p class="text-neutral-400 flex items-center gap-2">📍 Plateau, Dakar (À 2.5 km)</p>
                </div>
                
                <div class="text-right bg-black/40 p-4 rounded-2xl border border-white/5">
                    <p class="text-sm text-neutral-400 uppercase tracking-wider mb-1">File actuelle</p>
                    <p class="text-3xl font-bold text-white flex items-center justify-end gap-3">
                        <span class="w-3 h-3 rounded-full bg-orange-500 animate-pulse"></span>
                        3 véhicules
                    </p>
                </div>
            </div>
        </div>

        <h2 class="text-2xl font-bold mb-6">Choisissez votre lavage</h2>

        <!-- Grille des services -->
        <div class="grid md:grid-cols-2 gap-6 mb-12">
            
            <!-- Service 1 -->
            <label class="glass-card rounded-2xl p-6 cursor-pointer border border-white/10 hover:border-blue-500/50 transition-all flex flex-col justify-between relative group">
                <input type="radio" name="service" class="peer hidden" value="simple">
                <div class="absolute inset-0 border-2 border-blue-500 rounded-2xl opacity-0 peer-checked:opacity-100 pointer-events-none transition-opacity"></div>
                
                <div>
                    <div class="flex justify-between items-start mb-4">
                        <span class="text-3xl">🫧</span>
                        <div class="w-6 h-6 rounded-full border border-white/20 peer-checked:border-blue-500 peer-checked:bg-blue-500 flex items-center justify-center">
                            <span class="text-white opacity-0 peer-checked:opacity-100 text-xs">✓</span>
                        </div>
                    </div>
                    <h3 class="text-xl font-bold mb-2 group-hover:text-blue-400 transition-colors">Lavage Simple</h3>
                    <p class="text-neutral-400 text-sm mb-4">Carrosserie, vitres extérieures, et pneus.</p>
                </div>
                
                <div class="flex justify-between items-center mt-4 pt-4 border-t border-white/5">
                    <span class="text-emerald-400 text-sm font-medium">⏱ ~20 min</span>
                    <span class="text-xl font-bold">2 500 FCFA</span>
                </div>
            </label>

            <!-- Service 2 -->
            <label class="glass-card rounded-2xl p-6 cursor-pointer border border-white/10 hover:border-blue-500/50 transition-all flex flex-col justify-between relative group">
                <input type="radio" name="service" class="peer hidden" value="complet">
                <div class="absolute inset-0 border-2 border-blue-500 rounded-2xl opacity-0 peer-checked:opacity-100 pointer-events-none transition-opacity"></div>
                
                <div>
                    <div class="flex justify-between items-start mb-4">
                        <span class="text-3xl">✨</span>
                        <div class="w-6 h-6 rounded-full border border-white/20 peer-checked:border-blue-500 peer-checked:bg-blue-500 flex items-center justify-center">
                            <span class="text-white opacity-0 peer-checked:opacity-100 text-xs">✓</span>
                        </div>
                    </div>
                    <h3 class="text-xl font-bold mb-2 group-hover:text-blue-400 transition-colors">Lavage Complet</h3>
                    <p class="text-neutral-400 text-sm mb-4">Lavage simple + Nettoyage intérieur complet et aspirateur.</p>
                </div>
                
                <div class="flex justify-between items-center mt-4 pt-4 border-t border-white/5">
                    <span class="text-emerald-400 text-sm font-medium">⏱ ~45 min</span>
                    <span class="text-xl font-bold">5 000 FCFA</span>
                </div>
            </label>
        </div>

        <div class="flex justify-end border-t border-white/10 pt-8 mt-8">
            <button onclick="window.location.href='payment.html'" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-4 rounded-full text-lg font-bold transition-transform active:scale-95 shadow-lg shadow-blue-500/20 flex items-center gap-3">
                Prendre mon ticket
                <span>→</span>
            </button>
        </div>

    </main>

    <script>
        // Sélectionne le premier service par défaut
        document.querySelector('input[value="complet"]').checked = true;
    </script>
</body>
</html>
