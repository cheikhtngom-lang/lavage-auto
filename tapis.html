<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#F4F2EE">
    <title>Suivi de vos tapis — Clean Car Galsen</title>
    <!-- Aperçu du lien dans WhatsApp -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Clean Car Galsen">
    <meta property="og:title" content="Suivi de vos tapis">
    <meta property="og:description" content="Voyez où en est le lavage de vos tapis et moquettes, et quand passer les récupérer.">
    <meta property="og:image" content="https://galsenautocleaner.com/images/og-image.jpg">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F4F2EE; --card: #FFFFFF; --ink: #15171C; --muted: #5F6470; --faint: #8B909A; --line: #E6E3DC;
            --blue: #1F5FD6; --blue-soft: #E8EFFC; --green: #0E8A5F; --green-soft: #E3F4EC; --amber: #A15C07; --amber-soft: #FBF0DC;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
        main { width: min(480px, 100%); margin: 0 auto; padding: 20px 16px calc(32px + env(safe-area-inset-bottom)); }
        .brand { display: flex; align-items: center; gap: 10px; margin: 4px 2px 18px; font-weight: 600; font-size: 13px; color: var(--muted); }
        .brand img { width: 28px; height: 28px; border-radius: 8px; }
        .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px 20px; margin-bottom: 14px; }
        .eyebrow { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
        h1 { margin: 0 0 8px; font: 800 1.7rem/1.15 'Bricolage Grotesque', sans-serif; letter-spacing: -0.01em; text-wrap: balance; }
        h2 { margin: 0 0 6px; font: 700 1.15rem/1.25 'Bricolage Grotesque', sans-serif; }
        .lead { margin: 0; color: var(--muted); }
        .lead strong { color: var(--ink); font-weight: 600; }
        .flag { display: flex; gap: 10px; align-items: flex-start; border-radius: 12px; padding: 12px 14px; margin-top: 14px; font-size: 14px; }
        .flag--ready { background: var(--green-soft); color: #0B5B40; }
        .flag--late { background: var(--amber-soft); color: var(--amber); }
        .steps { list-style: none; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 20px 0 4px; padding: 0; }
        .steps li { min-width: 0; font-size: 12px; color: var(--faint); }
        .steps li::before { content: ''; display: block; height: 6px; border-radius: 6px; background: var(--line); margin-bottom: 7px; }
        .steps li.on { color: var(--muted); }
        .steps li.on::before { background: var(--blue); }
        .steps li.now { color: var(--ink); font-weight: 600; }
        .steps.done li.on::before { background: var(--green); }
        dl { margin: 18px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 14px; }
        dt { color: var(--muted); }
        dd { margin: 0; text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; }
        .row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
        .btn { flex: 1 1 auto; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: #fff; color: var(--ink); font: 600 15px 'Inter', sans-serif; text-decoration: none; cursor: pointer; transition: background-color .15s ease, transform .1s ease; }
        .btn:active { transform: scale(0.98); }
        .btn--primary { background: var(--blue); border-color: var(--blue); color: #fff; }
        .btn--primary:hover { background: #1A50B8; }
        .btn:not(.btn--primary):hover { background: #F7F6F3; }
        .btn svg { width: 18px; height: 18px; }
        .cta { border-color: #C9D8F5; background: linear-gradient(180deg, #F6F9FF, #fff 70%); }
        .muted { color: var(--muted); font-size: 14px; margin: 0; }
        .small { font-size: 13px; color: var(--faint); margin: 12px 0 0; }
        .state { text-align: center; padding: 40px 22px; }
        .skeleton { height: 360px; border-radius: 18px; background: linear-gradient(90deg, #ECEAE5, #F7F6F3, #ECEAE5); background-size: 200% 100%; animation: sh 1.4s linear infinite; }
        @keyframes sh { to { background-position: -200% 0; } }
        @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } .btn { transition: none; } }
        @media (hover: none) { .btn:not(.btn--primary):hover { background: #fff; } }
    </style>
</head>
<body>
    <main>
        <div class="brand"><img src="/icons/icon-192.png" alt="" width="28" height="28"> Clean Car Galsen</div>
        <div id="root"><div class="skeleton" aria-label="Chargement"></div></div>
    </main>
    <script type="module" src="/src/tapis.js"></script>
</body>
</html>
