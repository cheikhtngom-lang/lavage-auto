<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Nouveau mot de passe - Clean Car Galsen</title>
    <meta name="description" content="Réinitialisez votre mot de passe Clean Car Galsen.">
    <meta name="robots" content="noindex">

    <!-- Google Analytics (GA4) — remplacez G-XXXXXXXXXX par votre identifiant de mesure réel. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX');
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }
        .input-field {
            width: 100%;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 12px 16px;
            color: white;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-field::placeholder { color: rgba(255,255,255,0.3); }
        .input-field:focus { border-color: #3b82f6; }
        .glass-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
        }
        .btn-primary-blue {
            width: 100%;
            background: #3b82f6;
            color: white;
            font-weight: 700;
            padding: 13px 16px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 20px rgba(59,130,246,0.35);
        }
        .btn-primary-blue:hover { background: #2563eb; }
        .btn-primary-blue:disabled { opacity: 0.6; cursor: not-allowed; }
        .field-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: rgba(255,255,255,0.5);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-info {
            background: rgba(59,130,246,0.1);
            border: 1px solid rgba(59,130,246,0.2);
            color: #93c5fd;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 12px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body class="min-h-screen relative overflow-y-auto flex flex-col items-center justify-center pt-8 sm:pt-12 pb-12" style="background:#0a0a0a;">
    <div class="fixed top-1/2 left-1/4 w-96 h-96 bg-blue-600 rounded-full mix-blend-multiply filter blur-[128px] opacity-15 pointer-events-none -translate-y-1/2"></div>

    <main class="w-full max-w-md px-4 relative z-10">
        <div class="text-center mb-8">
            <span class="text-blue-400 text-4xl mb-3 inline-block">💧</span>
            <h1 class="text-2xl font-bold text-white tracking-tight">Nouveau mot de passe</h1>
        </div>

        <div class="glass-card rounded-3xl p-7 shadow-2xl">
            <div id="view-loading">
                <p class="text-neutral-400 text-sm text-center">Vérification du lien...</p>
            </div>

            <div id="view-form" class="hidden">
                <form id="reset-form">
                    <div class="space-y-4 mb-5">
                        <div>
                            <label class="field-label">Nouveau mot de passe</label>
                            <input id="new-password" type="password" placeholder="Min. 8 caractères" required minlength="8" class="input-field">
                        </div>
                        <div>
                            <label class="field-label">Confirmer le mot de passe</label>
                            <input id="new-password-confirm" type="password" placeholder="Répétez le mot de passe" required class="input-field">
                        </div>
                    </div>
                    <p id="reset-error" class="text-sm text-red-400 mb-4 hidden"></p>
                    <button type="submit" id="reset-submit-btn" class="btn-primary-blue">Réinitialiser le mot de passe</button>
                </form>
            </div>

            <div id="view-done" class="hidden">
                <div class="badge-info text-center">✅ Mot de passe mis à jour.</div>
                <a href="/login.html" class="btn-primary-blue inline-block text-center mt-2">Retour à la connexion</a>
            </div>

            <div id="view-invalid" class="hidden">
                <p class="text-sm text-red-400 text-center mb-5">Lien invalide ou expiré. Demandez un nouveau lien depuis la page de connexion.</p>
                <a href="/login.html" class="btn-primary-blue inline-block text-center">Retour à la connexion</a>
            </div>
        </div>
    </main>

    <script type="module">
        import { supabase } from '/src/lib/supabaseClient.js';
        import { confirmPasswordReset } from '/src/lib/accounts.js';

        function show(id) {
            ['view-loading', 'view-form', 'view-done', 'view-invalid'].forEach((v) => {
                document.getElementById(v).classList.toggle('hidden', v !== id);
            });
        }

        // Le lien de récupération établit automatiquement une session Supabase
        // au chargement de la page (detectSessionInUrl) — on attend cet événement
        // plutôt que de lire l'URL nous-mêmes.
        supabase.auth.onAuthStateChange((event, session) => {
            if (event === 'PASSWORD_RECOVERY') {
                show('view-form');
            }
        });

        supabase.auth.getSession().then(({ data }) => {
            if (data.session) show('view-form');
        });

        setTimeout(() => {
            if (document.getElementById('view-loading').classList.contains('hidden')) return;
            show('view-invalid');
        }, 4000);

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('new-password').value;
            const passwordConfirm = document.getElementById('new-password-confirm').value;
            const errorEl = document.getElementById('reset-error');
            const btn = document.getElementById('reset-submit-btn');
            errorEl.classList.add('hidden');

            if (password !== passwordConfirm) {
                errorEl.textContent = 'Les mots de passe ne correspondent pas.';
                errorEl.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            try {
                await confirmPasswordReset(password);
                show('view-done');
            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.classList.remove('hidden');
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
