<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Paiement annulé - Clean Car Galsen</title>
    <meta name="description" content="Le paiement Clean Car Galsen a été annulé.">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="stylesheet" href="app.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-[#0a0a0a] text-white flex items-center justify-center px-4">
    <div class="absolute top-0 -left-10 w-96 h-96 bg-neutral-600 rounded-full mix-blend-multiply filter blur-[128px] opacity-20 pointer-events-none"></div>

    <div class="relative max-w-lg w-full text-center">
        <div class="w-20 h-20 rounded-full bg-amber-500/15 border-2 border-amber-400 flex items-center justify-center mx-auto mb-8">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </div>

        <h1 class="text-3xl md:text-4xl font-bold mb-4">Paiement annulé</h1>
        <p class="text-neutral-400 text-lg mb-4">
            Aucun montant n'a été prélevé. Vous pouvez réessayer depuis votre
            espace, ou régler autrement (sur place pour un lavage).
        </p>
        <p class="text-neutral-500 text-sm mb-10">
            Pour un lavage, votre réservation reste dans la file — non payée.
        </p>

        <div class="flex flex-col sm:flex-row gap-3 justify-center">
            <button onclick="window.location.href='/dashboard'" class="bg-blue-600 hover:bg-blue-700 text-white rounded-full px-8 py-4 font-semibold shadow-lg shadow-blue-500/30 transition-transform active:scale-95">
                Espace automobiliste
            </button>
            <button onclick="window.location.href='/admin/queue'" class="border border-white/15 hover:border-white/30 text-white rounded-full px-8 py-4 font-semibold transition-colors">
                Espace station
            </button>
        </div>

        <p class="text-neutral-600 text-sm mt-8"><a href="/" class="hover:text-white transition-colors">← Retour à l'accueil</a></p>
    </div>
</body>
</html>
