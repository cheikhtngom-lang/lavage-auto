<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Bienvenue - Clean Car Galsen</title>
    <meta name="description" content="Votre compte Clean Car Galsen a été créé avec succès.">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="stylesheet" href="/app.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-[#0a0a0a] text-white flex items-center justify-center px-4">
    <div class="absolute top-0 -left-10 w-96 h-96 bg-blue-600 rounded-full mix-blend-multiply filter blur-[128px] opacity-20 pointer-events-none"></div>
    <div class="absolute top-0 -right-10 w-96 h-96 bg-emerald-600 rounded-full mix-blend-multiply filter blur-[128px] opacity-20 pointer-events-none"></div>

    <div class="relative max-w-lg w-full text-center">
        <div class="w-20 h-20 rounded-full bg-emerald-500/15 border-2 border-emerald-400 flex items-center justify-center mx-auto mb-8">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>

        <h1 class="text-3xl md:text-4xl font-bold mb-4">Merci, votre espace est prêt !</h1>
        <p class="text-neutral-400 text-lg mb-10">
            Votre compte station Clean Car Galsen a été créé et est déjà actif. Ajoutez votre premier laveur pour commencer à recevoir des réservations.
        </p>

        <button onclick="window.location.href='/admin/queue'" class="cta-beam bg-blue-600 hover:bg-blue-700 text-white rounded-full px-8 py-4 font-semibold shadow-lg shadow-blue-500/30 transition-transform active:scale-95">
            Accéder à mon tableau de bord
        </button>

        <p class="text-neutral-600 text-sm mt-8"><a href="/" class="hover:text-white transition-colors">← Retour à l'accueil</a></p>
    </div>
</body>
</html>
